name: CMake

on: [push, pull_request]

env:
  BUILD_TYPE: Debug

jobs:
  Build_And_Test:
    runs-on: ubuntu-latest
    # OpenCV 5 is required (<opencv2/geometry.hpp>) and Ubuntu still ships 4.x,
    # so build inside Arch, which packages OpenCV 5 and matches the dev setup.
    container: archlinux:base-devel

    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm --needed \
          git cmake ninja opencv qt6-base qt6-multimedia

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DTENGEN_BUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config $BUILD_TYPE -j$(nproc)

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure --parallel

  Clang_Tidy:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
    # clang brings clang-tidy and run-clang-tidy, which needs python.
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm --needed \
          git cmake ninja clang python opencv qt6-base qt6-multimedia

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Trust workspace
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DTENGEN_BUILD_TESTS=ON

    - name: Clang-Tidy
      run: |
        BUILD_DIR=build scripts/tidy.sh --strict

  Format_Check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: pipx install clang-format==23.1.1

    - name: Check formatting
      run: |
        CLANG_FORMAT="$(pipx environment --value PIPX_BIN_DIR)/clang-format" bash scripts/format.sh --check

  # Every file needs license and copyright information, see REUSE.toml.
  License_Check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: REUSE lint
      uses: fsfe/reuse-action@v6
